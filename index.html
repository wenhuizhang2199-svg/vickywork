<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VickyWork · 无代码可视化跨境运营工作台 v5.0</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f5f6fb; --card: #fff; --text: #202638; --muted: #7c8497;
  --line: #e7eaf1; --accent: #f487b8; --shadow: 0 10px 28px rgba(34,45,75,.08);
  --font-size-base: 14px; --font-weight-base: 500;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "Microsoft YaHei", sans-serif; font-size: var(--font-size-base); font-weight: var(--font-weight-base); }
button, input, textarea, select { font: inherit; } button { cursor: pointer; }

/* 顶栏与动态导航 */
.top { height: 68px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 245px; }
.logo { font-size: 26px; } .brand b { font-size: 21px; color: var(--accent); }
.nav { display: flex; gap: 6px; flex: 1; align-items: center; overflow-x: auto; }
.nav button { border: 0; background: transparent; padding: 8px 14px; border-radius: 12px; transition: all .2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.nav button:hover { background: #fff0f7; }
.nav button.active { background: var(--accent); color: #fff !important; }

.topright { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: #fff; color: #3d4658; border-radius: 11px; padding: 8px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.danger { color: #d84058; }

main { max-width: 1400px; margin: 24px auto; padding: 0 24px; }
.view { display: none; } .view.active { display: block; }

/* 通用模块布局：左侧边栏类目 + 右侧内容画布 */
.module-layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
.module-sidebar { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.module-sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; border: 0; background: transparent; color: var(--text); font-weight: 600; transition: all .2s; }
.module-sidebar-item:hover { background: #fff0f7; color: var(--accent); }
.module-sidebar-item.active { background: var(--accent); color: #fff; }

.canvas-area { display: flex; flex-direction: column; gap: 16px; }
.block-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); position: relative; }
.block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.block-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

/* 特殊区块形态：网页内嵌 iFrame */
.iframe-container { width: 100%; height: 550px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.iframe-container iframe { width: 100%; height: 100%; border: 0; }

/* 模态框及编辑器 */
.modalbg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; backdrop-filter: blur(4px); }
.modalbg.show { display: flex; }
.modal { width: min(680px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1/-1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 700; }
.input, .select, .textarea { border: 1px solid var(--line); background: #fbfcff; border-radius: 10px; padding: 10px; outline: 0; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">🔧</div>
    <b id="brandTitle">VickyWork</b>
    <span style="font-size:12px;color:var(--muted)" id="brandSub">跨境运营工作台</span>
  </div>
  
  <!-- 动态可修改导航栏 -->
  <nav class="nav" id="mainNav"></nav>
  
  <div class="topright">
    <button class="btn small primary" onclick="openNavManagerModal()">⚙️ 修改导航栏结构与样式</button>
  </div>
</header>

<main>

<!-- 通用板块渲染模板引擎 -->
<div id="dynamicViewContainer"></div>

</main>

<!-- 导航栏自定义修改 Modal -->
<div class="modalbg" id="navManagerModal">
  <div class="modal">
    <h2>⚙️ 导航栏板块、图标及字体外观自定义</h2>
    <p style="font-size:12px;color:var(--muted);margin-top:-10px;">你可以随意新增、修改板块名称、Emoji图标、字体颜色大小与粗细，甚至删除板块。</p>
    <div id="navEditList" style="display:flex;flex-direction:column;gap:10px;margin:16px 0;"></div>
    <button class="btn small primary" onclick="addNewNavItem()">＋ 新增导航菜单板块</button>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="btn" onclick="closeModal('navManagerModal')">取消</button>
      <button class="btn primary" onclick="saveNavConfig()">保存并应用外观结构</button>
    </div>
  </div>
</div>

<!-- 侧边栏类目添加 Modal -->
<div class="modalbg" id="sidebarCategoryModal">
  <div class="modal">
    <h2>📂 新增/修改左侧分类区块</h2>
    <div class="field" style="margin-top:12px;">
      <label>分类名称</label>
      <input class="input" id="catNameInput" placeholder="例如：Fitment 零部件适配表">
    </div>
    <div class="field" style="margin-top:12px;">
      <label>分类图标 Emoji</label>
      <input class="input" id="catIconInput" value="📦">
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="btn" onclick="closeModal('sidebarCategoryModal')">取消</button>
      <button class="btn primary" onclick="saveCategoryItem()">保存分类</button>
    </div>
  </div>
</div>

<!-- 内容区块添加 Modal (支持嵌入网址、文本、表格) -->
<div class="modalbg" id="blockBuilderModal">
  <div class="modal">
    <h2>🧩 在此页面添加全新区块内容</h2>
    <div class="formgrid" style="margin-top:12px;">
      <div class="field">
        <label>区块标题</label>
        <input class="input" id="blockTitleInput" placeholder="如：Shopify 独立站后台 / 爆款 List">
      </div>
      <div class="field">
        <label>区块展示形式</label>
        <select class="select" id="blockTypeSelect" onchange="toggleBlockTypeFields()">
          <option value="text">📝 富文本 / SOP 笔记卡片</option>
          <option value="iframe">🌐 嵌入第三方网页 / 外部网址 (iFrame)</option>
        </select>
      </div>
      <div class="field full" id="blockUrlGroup" style="display:none;">
        <label>需要直接嵌在页面上的网页网址 (URL)</label>
        <input class="input" id="blockUrlInput" placeholder="https://partsphoenix.com 或任何允许内嵌的网址">
      </div>
      <div class="field full" id="blockTextGroup">
        <label>区块详细内容 / 样式代码</label>
        <textarea class="textarea" id="blockContentInput" rows="6" placeholder="输入你想展现的任何数据、文案或 SOP 说明..."></textarea>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="btn" onclick="closeModal('blockBuilderModal')">取消</button>
      <button class="btn primary" onclick="saveNewBlock()">确认添加到当前页面</button>
    </div>
  </div>
</div>

<script>
// 全局建模数据结构 (初始化)
let appConfig = JSON.parse(localStorage.getItem('vicky_app_config_v5')) || {
  navs: [
    { id: 'home', name: '首页', icon: '🏠', color: '#333333', fontSize: '14', fontWeight: '700' },
    { id: 'product', name: '汽配产品运营', icon: '📦', color: '#f487b8', fontSize: '14', fontWeight: '700' },
    { id: 'service', name: '客服', icon: '💬', color: '#333333', fontSize: '14', fontWeight: '700' },
    { id: 'shopify', name: '独立站', icon: '🛍', color: '#333333', fontSize: '14', fontWeight: '700' }
  ],
  modules: {
    product: {
      categories: [
        { id: 'c1', name: 'Fitment 零部件适配表', icon: '📄' },
        { id: 'c2', name: 'OE 替换号查询系统', icon: '🔍' }
      ],
      blocks: {
        c1: [
          { id: 'b1', title: '汽配 Fitment 批量表', type: 'text', content: '这里可以存放刹车片、火花塞各车型的匹配数据逻辑。' },
          { id: 'b2', title: 'PartsPhoenix 适配网页嵌入', type: 'iframe', url: 'https://partsphoenix.com' }
        ]
      }
    }
  }
};

let currentViewId = 'product';
let currentCatId = 'c1';

function persistConfig() {
  localStorage.setItem('vicky_app_config_v5', JSON.stringify(appConfig));
  renderApp();
}

function esc(v) { return String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

/* 渲染导航与主页面 */
function renderApp() {
  // 1. 渲染导航栏
  const navContainer = document.getElementById('mainNav');
  navContainer.innerHTML = appConfig.navs.map(n => `
    <button class="${currentViewId === n.id ? 'active' : ''}" 
            style="color:${n.color}; font-size:${n.fontSize}px; font-weight:${n.fontWeight};" 
            onclick="switchView('${n.id}')">
      <span>${n.icon}</span> <span>${esc(n.name)}</span>
    </button>
  `).join('');

  // 2. 渲染当前视图画布
  const canvas = document.getElementById('dynamicViewContainer');
  const modData = appConfig.modules[currentViewId] || { categories: [], blocks: {} };

  if (modData.categories.length === 0) {
    modData.categories.push({ id: 'default', name: '通用列表', icon: '📌' });
    modData.blocks['default'] = [];
  }
  if (!currentCatId || !modData.categories.find(c => c.id === currentCatId)) {
    currentCatId = modData.categories[0].id;
  }

  const currentBlocks = modData.blocks[currentCatId] || [];

  canvas.innerHTML = `
    <div class="module-layout">
      <!-- 左侧边栏：自定义类目区 -->
      <div class="module-sidebar">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <b style="font-size:13px;color:var(--muted);">📂 板块侧边栏类目</b>
          <button class="btn small" onclick="openAddCategoryModal()">＋</button>
        </div>
        ${modData.categories.map(c => `
          <button class="module-sidebar-item ${currentCatId === c.id ? 'active' : ''}" onclick="switchCategory('${c.id}')">
            <span>${c.icon} ${esc(c.name)}</span>
            <span style="font-size:10px;opacity:.6;" onclick="event.stopPropagation();deleteCategory('${c.id}')">✕</span>
          </button>
        `).join('')}
      </div>

      <!-- 右侧画布：自由定义的内容与区块 -->
      <div class="canvas-area">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="margin:0;font-size:20px;">${esc(modData.categories.find(c => c.id === currentCatId)?.name || '未命名')}</h2>
          <button class="btn primary small" onclick="openAddBlockModal()">🧩 在此页面增加展示区块 / 嵌套网址</button>
        </div>

        ${currentBlocks.length === 0 ? `<div class="block-card" style="text-align:center;color:var(--muted);padding:40px;">当前类目下暂无内容区块，点击右上角添加。</div>` : ''}

        ${currentBlocks.map((b, idx) => `
          <div class="block-card">
            <div class="block-head">
              <div class="block-title">📌 ${esc(b.title)}</div>
              <button class="btn small danger" onclick="deleteBlock(${idx})">删除区块</button>
            </div>
            ${b.type === 'iframe' ? `
              <div class="iframe-container">
                <iframe src="${esc(b.url)}"></iframe>
              </div>
            ` : `
              <div style="white-space:pre-wrap;line-height:1.6;color:#4a5264;">${esc(b.content)}</div>
            `}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function switchView(viewId) { currentViewId = viewId; renderApp(); }
function switchCategory(catId) { currentCatId = catId; renderApp(); }

/* 导航栏可视化配置处理 */
function openNavManagerModal() {
  const container = document.getElementById('navEditList');
  container.innerHTML = appConfig.navs.map((n, i) => `
    <div style="display:grid;grid-template-columns: 40px 100px 80px 80px 80px 40px; gap:8px; align-items:center; background:#fafbfe; padding:8px; border-radius:10px; border:1px solid var(--line);">
      <input class="input" value="${n.icon}" id="navIcon_${i}">
      <input class="input" value="${n.name}" id="navName_${i}">
      <input class="input" type="color" value="${n.color}" id="navColor_${i}">
      <input class="input" type="number" value="${n.fontSize}" id="navSize_${i}" placeholder="字号">
      <select class="select" id="navWeight_${i}">
        <option value="400" ${n.fontWeight==='400'?'selected':''}>常规</option>
        <option value="700" ${n.fontWeight==='700'?'selected':''}>加粗</option>
      </select>
      <button class="btn small danger" onclick="removeNavItem(${i})">✕</button>
    </div>
  `).join('');
  document.getElementById('navManagerModal').classList.add('show');
}

function addNewNavItem() {
  const id = 'custom_' + Date.now();
  appConfig.navs.push({ id, name: '新板块', icon: '📝', color: '#333333', fontSize: '14', fontWeight: '700' });
  openNavManagerModal();
}

function removeNavItem(idx) {
  appConfig.navs.splice(idx, 1);
  openNavManagerModal();
}

function saveNavConfig() {
  appConfig.navs.forEach((n, i) => {
    if (document.getElementById(`navName_${i}`)) {
      n.icon = document.getElementById(`navIcon_${i}`).value;
      n.name = document.getElementById(`navName_${i}`).value;
      n.color = document.getElementById(`navColor_${i}`).value;
      n.fontSize = document.getElementById(`navSize_${i}`).value;
      n.fontWeight = document.getElementById(`navWeight_${i}`).value;
    }
  });
  closeModal('navManagerModal');
  persistConfig();
}

/* 侧边栏与区块操作 */
function openAddCategoryModal() { document.getElementById('sidebarCategoryModal').classList.add('show'); }
function saveCategoryItem() {
  const name = document.getElementById('catNameInput').value.trim();
  const icon = document.getElementById('catIconInput').value.trim() || '📂';
  if (!name) return;
  const modData = appConfig.modules[currentViewId] = appConfig.modules[currentViewId] || { categories: [], blocks: {} };
  const catId = 'c_' + Date.now();
  modData.categories.push({ id: catId, name, icon });
  modData.blocks[catId] = [];
  closeModal('sidebarCategoryModal');
  currentCatId = catId;
  persistConfig();
}

function deleteCategory(catId) {
  if (confirm('确认删除此侧边栏分类？')) {
    const modData = appConfig.modules[currentViewId];
    modData.categories = modData.categories.filter(c => c.id !== catId);
    delete modData.blocks[catId];
    persistConfig();
  }
}

function openAddBlockModal() { document.getElementById('blockBuilderModal').classList.add('show'); }
function toggleBlockTypeFields() {
  const type = document.getElementById('blockTypeSelect').value;
  document.getElementById('blockUrlGroup').style.display = type === 'iframe' ? 'flex' : 'none';
  document.getElementById('blockTextGroup').style.display = type === 'text' ? 'flex' : 'none';
}

function saveNewBlock() {
  const title = document.getElementById('blockTitleInput').value.trim() || '新建区块';
  const type = document.getElementById('blockTypeSelect').value;
  const url = document.getElementById('blockUrlInput').value.trim();
  const content = document.getElementById('blockContentInput').value.trim();

  const modData = appConfig.modules[currentViewId];
  modData.blocks[currentCatId] = modData.blocks[currentCatId] || [];
  modData.blocks[currentCatId].push({ id: 'b_' + Date.now(), title, type, url, content });

  closeModal('blockBuilderModal');
  persistConfig();
}

function deleteBlock(idx) {
  if (confirm('确定删除该内容区块？')) {
    appConfig.modules[currentViewId].blocks[currentCatId].splice(idx, 1);
    persistConfig();
  }
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

renderApp();
</script>
</body>
</html>
